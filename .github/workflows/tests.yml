name: CPU correctness
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src scripts tests modal_train.py
      - run: python -m pytest tests -q
      - run: python scripts/08_run_study.py --experiment controlled > /tmp/study-plan.json
